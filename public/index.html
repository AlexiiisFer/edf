<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Météo de mon logement — Lobby</title>
<style>
  :root { --bg: #0b2233; --card: #12324a; --ink: #fff; --muted: #9fb6c6; --hot: #ff6a3d; --cool: #3cb4ff; --ok: #2fd39a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: radial-gradient(circle at 20% 0%, #163e5a, var(--bg) 60%); color: var(--ink); min-height: 100vh; padding: 3vh 3vw; overflow: hidden; }
  .wrap { display: grid; grid-template-columns: 30vw 1fr; gap: 3vw; height: 94vh; }
  .left { display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 1vw; margin-bottom: 3vh; }
  .logo { width: 3.4vw; height: 3.4vw; border-radius: .8vw; background: linear-gradient(135deg, var(--hot), #f5a623); display: grid; place-items: center; font-size: 2vw; }
  .brand b { font-size: 1.7vw; }
  h1 { font-size: 2.8vw; line-height: 1.1; margin-bottom: 3vh; }
  h1 span { color: var(--hot); }
  .qrbox { background: #fff; border-radius: 1.4vw; padding: 1.4vw; }
  .qrbox img { width: 100%; display: block; image-rendering: pixelated; }
  .url { color: var(--muted); font-size: 1vw; margin-top: 1.5vh; word-break: break-all; text-align: center; }
  .right { background: var(--card); border-radius: 1.6vw; padding: 2.4vw; display: flex; flex-direction: column; min-height: 0; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; }
  .count { font-size: 1.6vw; color: var(--muted); }
  .count b { font-size: 4.5vw; color: #fff; margin-right: .6vw; vertical-align: middle; }
  .players { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 1vw; overflow: hidden; }
  .chip { width: 4.2vw; height: 4.2vw; display: grid; place-items: center; border-radius: 50%; font-size: 2.2vw; animation: pop .45s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; }
  .chip:nth-child(4n+1) { background: rgba(255,106,61,.2); } .chip:nth-child(4n+2) { background: rgba(60,180,255,.2); }
  .chip:nth-child(4n+3) { background: rgba(47,211,154,.2); } .chip:nth-child(4n) { background: rgba(245,166,35,.2); }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .empty { color: var(--muted); font-size: 1.6vw; margin: auto; text-align: center; }
  .empty .dots::after { content: ""; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .actions { display: flex; gap: 1vw; align-items: center; margin-top: 2vh; }
  .btn { padding: 1.6vh 2.6vw; font-size: 1.6vw; font-weight: 700; border: 0; border-radius: 1vw; cursor: pointer; background: var(--ok); color: #05261a; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,.2); font-size: 1.1vw; padding: 1.2vh 1.4vw; font-weight: 500; }
  .btn:disabled { opacity: .5; }
  .admin { display: none; gap: .6vw; align-items: center; margin-left: auto; }
  .admin input { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); color: #fff; padding: 1.1vh 1vw; border-radius: .6vw; font-size: 1.1vw; width: 14vw; }
  .msg { color: var(--hot); font-size: 1.1vw; }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="brand"><div class="logo">☀</div><b>Météo de mon logement</b></div>
    <h1>Quelle température fera-t-il <span>chez vous</span> demain ?</h1>
    <div class="qrbox"><img id="qr" alt="QR code pour rejoindre"></div>
    <div class="url">📱 Scannez pour rejoindre · <span id="url"></span></div>
  </div>

  <div class="right">
    <div class="head">
      <div class="count"><b id="count">0</b>personnes connectées</div>
      <div class="count" id="phaseLbl"></div>
    </div>
    <div class="players" id="players"><div class="empty">En attente des participants<span class="dots"></span></div></div>
    <div class="actions">
      <button class="btn" id="startBtn" onclick="start()">▶ Lancer la session</button>
      <button class="btn ghost" onclick="location.href='/stats'">Voir les statistiques</button>
      <button class="btn ghost" onclick="reset()">Nouvelle session</button>
      <div class="admin" id="admin">
        <input id="token" type="password" placeholder="Mot de passe animateur">
        <button class="btn ghost" onclick="saveToken()">OK</button>
      </div>
      <span class="msg" id="msg"></span>
    </div>
  </div>
</div>

<script src="/qrcode.js"></script>
<script>
const joinUrl = location.origin + "/jouer";
const qr = qrcode(0, "M"); qr.addData(joinUrl); qr.make();
document.getElementById("qr").src = qr.createDataURL(10, 2);
document.getElementById("url").textContent = joinUrl.replace(/^https?:\/\//, "");

// --- Mot de passe animateur ---
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const urlToken = new URLSearchParams(location.search).get("admin");
if (urlToken) store.set("ml_admin", urlToken);
let pending = null;

async function admin(action) {
  const token = store.get("ml_admin");
  if (!token) { pending = action; askToken(); return false; }
  const r = await fetch(`/api/admin/${action}?token=${encodeURIComponent(token)}`, { method: "POST" });
  if (r.status === 403) { store.set("ml_admin", ""); pending = action; askToken("Mot de passe incorrect"); return false; }
  document.getElementById("msg").textContent = "";
  return r.ok;
}
function askToken(msg) {
  document.getElementById("admin").style.display = "flex";
  document.getElementById("msg").textContent = msg || "";
  document.getElementById("token").focus();
}
async function saveToken() {
  store.set("ml_admin", document.getElementById("token").value);
  document.getElementById("admin").style.display = "none";
  if (pending) { const a = pending; pending = null; a === "start" ? start() : reset(); }
}
document.getElementById("token").addEventListener("keydown", e => { if (e.key === "Enter") saveToken(); });

async function start() {
  if (await admin("start")) location.href = "/stats";
}
async function reset() {
  if (await admin("reset")) { shown.clear(); document.getElementById("players").innerHTML = ""; refresh(); }
}

// --- Liste des joueurs en direct ---
const shown = new Map();
const ICONS = ["☀️", "🌡️", "🏠", "🪟", "🌿", "💧", "🌙", "🍃", "❄️", "🌤️"];
let lastSession = null;
async function refresh() {
  try {
    const d = await (await fetch("/api/lobby", { cache: "no-store" })).json();
    if (d.sessionId !== lastSession) { lastSession = d.sessionId; shown.clear(); document.getElementById("players").innerHTML = ""; }
    const box = document.getElementById("players");
    document.getElementById("count").textContent = d.players.length;
    document.getElementById("phaseLbl").textContent = d.phase === "running" ? "🟢 Session en cours" : d.phase === "ended" ? "Session terminée" : "";
    document.getElementById("startBtn").textContent = d.phase === "running" ? "▶ Aller aux statistiques" : "▶ Lancer la session";
    if (!d.players.length) {
      box.innerHTML = '<div class="empty">En attente des participants<span class="dots"></span></div>';
      return;
    }
    box.querySelector(".empty")?.remove();
    d.players.forEach((p, i) => {
      const key = i;
      if (shown.has(key)) return;
      const el = document.createElement("div");
      el.className = "chip";
      el.textContent = ICONS[i % ICONS.length];
      box.appendChild(el);
      shown.set(key, el);
    });
  } catch (e) {}
}
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
