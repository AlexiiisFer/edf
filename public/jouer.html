<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2342">
<title>Mon parcours fraîcheur · Météo de mon logement</title>
<link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/theme.css">
<style>
body { background: #eef3f8; color: var(--encre); min-height: 100vh; }
.hero-bg { position: absolute; inset: 0 0 auto; height: 300px; transition: height .5s var(--ease); z-index: 0; background: radial-gradient(90% 120% at 100% 0%, #2a5a92 0%, var(--nuit) 60%); overflow: hidden; }
.hero-bg::after { content: ""; position: absolute; width: 240px; height: 240px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,69,.75), rgba(255,106,61,.25) 55%, transparent 70%); filter: blur(10px); animation: glow 8s ease-in-out infinite alternate; }
.app { position: relative; z-index: 1; max-width: 560px; margin: auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; color: #fff; font-weight: 700; }
header .edf-logo { width: 64px; }
header small { color: var(--brume); font-weight: 500; font-size: 13px; }
h1 { font-size: 32px; line-height: 1.05; margin: 10px 0 14px; font-weight: 760; font-variation-settings: "opsz" 96, "wdth" 94; letter-spacing: -.02em; }
h2 { font-size: 20px; line-height: 1.2; margin-bottom: 12px; font-weight: 720; }
p { line-height: 1.5; margin: 10px 0; }
.muted, small { color: var(--gris); font-size: 14px; }
.view { display: none; } .view.active { display: block; }
.intro { color: #fff; }
.intro p { color: #d5e2f0; }
.intro .muted { color: var(--brume); }
.stage-label { font-size: 12px; font-weight: 700; color: var(--soleil); letter-spacing: .14em; text-transform: uppercase; margin: 0; }

/* Étapes du parcours */
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 18px; }
.stepper span { height: 5px; border-radius: 99px; background: rgba(255,255,255,.2); position: relative; overflow: hidden; }
.stepper span::after { content: ""; position: absolute; inset: 0; background: var(--soleil); transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease); }
.stepper span.on::after { transform: scaleX(1); }

.block { background: var(--papier); border: 1px solid var(--ligne); border-radius: var(--r); padding: 20px; margin: 14px 0; box-shadow: 0 1px 2px rgba(19,42,74,.04), 0 10px 30px rgba(19,42,74,.06); }
.block.dark { background: var(--nuit); color: #fff; border-color: transparent; }

.btn { display: block; width: 100%; padding: 17px; margin-top: 12px; border-radius: 16px; background: var(--nuit); color: #fff; font-size: 16px; }
.btn.secondary { background: transparent; color: var(--encre); border: 1px solid #cdd8e4; }
.btn.primary { background: var(--soleil); color: var(--encre); box-shadow: 0 8px 24px rgba(255,200,69,.35); }
.btn.primary:hover { background: var(--soleil-2); }

/* Attente */
.wait-card { text-align: center; padding: 34px 20px; }
.radar { width: 120px; height: 120px; margin: 4px auto 18px; position: relative; }
.radar i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--soleil); opacity: 0; animation: ping 2.4s ease-out infinite; }
.radar i:nth-child(2) { animation-delay: .8s; } .radar i:nth-child(3) { animation-delay: 1.6s; }
.radar b { position: absolute; inset: 38px; border-radius: 50%; background: var(--soleil); box-shadow: 0 0 30px rgba(255,200,69,.7); }
@keyframes ping { from { transform: scale(.3); opacity: .9; } to { transform: scale(1); opacity: 0; } }

/* Question */
.progress { display: flex; justify-content: space-between; align-items: center; color: var(--brume); font-size: 14px; }
.progress b { color: var(--encre); background: var(--soleil); border-radius: 99px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--papier); color: var(--encre); border: 1.5px solid var(--ligne); border-radius: 16px; padding: 14px 16px; margin: 10px 0; font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; transition: border-color .2s, background .2s, transform .15s; box-shadow: 0 4px 14px rgba(19,42,74,.05); }
.opt .e { width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #f1f5f9; display: grid; place-items: center; font-size: 22px; }
.opt:active { transform: scale(.98); }
.opt.sel { background: var(--nuit); color: #fff; border-color: var(--nuit); }
.opt.sel .e { background: rgba(255,255,255,.12); }
.opt:disabled:not(.sel) { opacity: .5; }
#qDone { text-align: center; font-weight: 600; color: var(--bon); }
.qbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-bottom: 16px; }
.qbar i { height: 5px; border-radius: 99px; background: rgba(255,255,255,.2); transition: background .3s; }
.qbar i.done { background: var(--fraicheur); } .qbar i.now { background: var(--soleil); }
.progress span { color: var(--soleil); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.opt .txt small { display: block; font-weight: 500; font-size: 13px; color: var(--gris); margin-top: 3px; line-height: 1.35; }
.opt.sel .txt small { color: var(--brume); }
.meteo-res { margin-top: 14px; padding: 14px; border-radius: 14px; background: #f3f7fb; }
.meteo-res.alert { background: #fff1e8; }
.meteo-days { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
.meteo-days span { flex: 1; min-width: 0; text-align: center; padding: 6px 2px; border-radius: 10px; background: #fff; font-size: 12px; color: var(--gris); }
.meteo-days span b { display: block; font-size: 15px; color: var(--encre); }
.meteo-days span.hot { background: #ffe2d3; } .meteo-days span.hot b { color: #9a3412; }

/* Profil */
.profile-card { text-align: center; }
.profile-card .who { font-size: 13px; color: var(--gris); letter-spacing: .08em; text-transform: uppercase; }
.big-grade { font-size: 64px; width: 1.5em; height: 1.5em; border-radius: 22px; margin: 14px auto 6px; box-shadow: 0 14px 30px rgba(19,42,74,.15); }
.temp { font-size: 44px; font-weight: 760; letter-spacing: -.02em; }
.temp small { font-size: 16px; font-weight: 600; letter-spacing: 0; margin-left: 4px; }
.profile-card .grade-scale { justify-content: center; }
.profile-card .grade-scale .grade { min-width: 34px; }

/* Choix */
.choice { display: grid; grid-template-columns: 1fr 30px; gap: 14px; align-items: start; padding: 16px; margin: 0 -8px; border-radius: 14px; cursor: pointer; border: 1.5px solid transparent; transition: background .2s, border-color .2s; }
.choice + .choice { margin-top: 6px; }
.choice:hover { background: #f6f9fc; }
.choice:has(input:checked) { background: #fff8e6; border-color: var(--soleil); }
.choice:has(input:disabled) { opacity: .5; cursor: not-allowed; }
.choice input { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #c3cfdc; display: grid; place-items: center; cursor: inherit; transition: background .2s, border-color .2s; margin-top: 2px; }
.choice input::after { content: ""; width: 10px; height: 6px; border: solid var(--encre); border-width: 0 0 3px 3px; transform: rotate(-45deg) scale(0); margin-top: -3px; transition: transform .25s var(--ease); }
.choice input:checked { background: var(--soleil); border-color: var(--soleil); }
.choice input:checked::after { transform: rotate(-45deg) scale(1); }
.choice strong, .choice small { display: block; }
.choice strong { font-size: 16px; line-height: 1.3; }
.choice small { margin-top: 4px; line-height: 1.4; }
.price { display: inline-block !important; font-weight: 700; margin-top: 10px !important; color: var(--encre) !important; background: #eef3f8; padding: 3px 10px; border-radius: 99px; font-size: 13px; }

/* Barre d'aperçu */
.live { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom)); margin-top: 18px; background: rgba(15,35,66,.94); backdrop-filter: blur(10px); color: #fff; padding: 14px 16px; border-radius: 18px; box-shadow: 0 12px 34px rgba(15,35,66,.35); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.live .temp-now { font-weight: 760; font-size: 18px; }
.live small { color: var(--brume); font-size: 12px; display: block; }
.live .grade { padding: 6px 9px; }

/* Bilan */
.stages { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 18px 0 10px; }
.stages > div { text-align: center; flex: 1; }
.stages .grade { font-size: 26px; width: 1.9em; height: 1.9em; border-radius: 14px; }
.stages small { display: block; margin-top: 8px; font-size: 12px; }
.stages .arrow { color: #b5c3d2; font-weight: 700; }
.temps { display: flex; justify-content: space-between; background: #f3f7fb; border-radius: 12px; padding: 10px 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
label.field { display: block; margin: 14px 0; font-weight: 600; font-size: 15px; }
label.field input { display: block; width: 100%; padding: 13px 14px; margin-top: 8px; border: 1.5px solid var(--ligne); border-radius: 12px; font: inherit; font-size: 17px; background: #f8fafc; }
label.field input:focus { outline: none; border-color: var(--nuit); background: #fff; }
.metric { font-size: 34px; font-weight: 780; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 6px 12px; border-radius: 99px; font-weight: 700; font-size: 15px; }
.pill.good { background: #e3f4ec; color: #1f6b4e; } .pill.bad { background: #fde9e1; color: #9a3412; }

/* Bilan dans le temps : barres de fourchette autour de zéro */
.tl-row { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--ligne); }
.tl-row:last-child { border-bottom: 0; }
.tl-row > b { font-size: 15px; }
.tl-val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.tl-val small { font-weight: 500; font-size: 12px; margin-left: 4px; }
.tl-track { position: relative; height: 10px; margin-top: 8px; background: #eef3f8; border-radius: 99px; }
.tl-zero { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #9fb0c3; border-radius: 2px; }
.tl-bar { position: absolute; top: 0; bottom: 0; border-radius: 99px; min-width: 4px; transform-origin: center; }
.tl-bar.pos { background: #3aa57c; } .tl-bar.neg { background: #e8774f; } .tl-bar.mix { background: linear-gradient(90deg, #e8774f, #3aa57c); }
.tl-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--gris); }
.tl-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.error { color: #a12d16; background: #fdebe6; border-radius: 12px; padding: 0; }
.error:not(:empty) { padding: 12px 14px; }
details summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details summary::after { content: "+"; font-size: 22px; color: var(--gris); transition: transform .25s; }
details[open] summary::after { transform: rotate(45deg); }
ul { padding-left: 20px; line-height: 1.5; } li { margin: 10px 0; font-size: 14px; color: #35506f; }
.thanks-icon { width: 76px; height: 76px; margin: 6px 0 10px; }
.thanks-icon circle { fill: var(--soleil); }
.thanks-icon path { fill: none; stroke: var(--encre); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
#saveStatus { color: #a12d16; font-weight: 600; }
.sec-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.sec-title h2 { margin: 0; }
.tag-low, .tag-high { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; }
.tag-low { background: #e3f4ec; color: #1f6b4e; } .tag-high { background: #e6eefb; color: #24497a; }
.me { display: flex; align-items: center; gap: 16px; }
.me .big-grade { font-size: 40px; margin: 0; width: 1.6em; height: 1.6em; border-radius: 16px; }
.me .temp { font-size: 30px; }
.me .alert { margin: 4px 0 0; font-size: 14px; color: #9a3412; font-weight: 600; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.sum div { background: #f3f7fb; border-radius: 14px; padding: 12px 14px; }
.sum small { display: block; font-size: 12px; }
.sum b { font-size: 19px; font-variant-numeric: tabular-nums; }
.sum .wide { grid-column: 1 / -1; }
.choice small.price { margin-top: 6px !important; }
.choice { padding: 12px 14px; }

/* ----- Une page = un écran, sans défilement ----- */
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 14px calc(6px + env(safe-area-inset-bottom)); }
header { margin-bottom: 10px; gap: 12px; font-size: 15px; }
header .edf-logo { width: 50px; padding: 6px 8px; border-radius: 8px; }
h1 { font-size: clamp(22px, 3.7vh, 30px); margin: 4px 0 8px; }
.view.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.block { padding: 14px; margin: 8px 0; }
.btn { padding: 14px; margin-top: 8px; }
.btn.link { background: none; border: 0; color: var(--gris); padding: 10px; margin-top: 2px; font-weight: 600; font-size: 15px; }
.qbar { margin-bottom: 10px; }
.opt { padding: clamp(8px, 1.5vh, 14px) 14px; margin: clamp(5px, .9vh, 9px) 0; font-size: 16px; }
.opt .e { width: 38px; height: 38px; font-size: 20px; border-radius: 10px; }
#qBack { margin-top: auto; }
/* Solutions : tuiles compactes sur deux colonnes */
.me-strip { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
.me-strip .grade { font-size: 24px; width: 1.7em; height: 1.7em; border-radius: 12px; }
.me-strip .t { font-weight: 760; font-size: 19px; line-height: 1.1; }
.me-strip .t small { font-weight: 500; font-size: 13px; }
.me-strip .alert { margin: 3px 0 0; font-size: 13px; color: #9a3412; font-weight: 600; }
.tiles-head { margin: 8px 0 6px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.choice.tile { display: block; position: relative; margin: 0; padding: 10px 34px 10px 11px; background: #fff; border: 1.5px solid var(--ligne); border-radius: 14px; }
.choice.tile + .choice.tile { margin-top: 0; }
.choice.tile strong { font-size: 14px; line-height: 1.25; }
.choice.tile .price { margin-top: 5px !important; font-size: 12px; padding: 2px 8px; }
.choice.tile input { position: absolute; top: 9px; right: 9px; width: 22px; height: 22px; margin: 0; }
.choice.tile input::after { width: 8px; height: 5px; border-width: 0 0 2.5px 2.5px; }
.live { position: static; margin-top: auto; padding: 10px 10px 10px 14px; }
.live .go { border: 0; border-radius: 12px; background: var(--soleil); color: var(--encre); font-weight: 760; padding: 11px 14px; cursor: pointer; white-space: nowrap; }
.live .temp-now { font-size: 16px; white-space: nowrap; }
.live .mid { display: flex; align-items: center; gap: 10px; }
#v-choices .tiles-head + .tiles { margin-bottom: 2px; }
/* Bilan compact */
.stages { margin: 6px 0 8px; }
.stages .grade { font-size: 22px; }
.temps { margin: 6px 0; padding: 8px 14px; }
.sum { margin-top: 8px; gap: 8px; }
.sum div { padding: 9px 12px; }
.sum b { font-size: 17px; }
#effect { margin: 8px 0 0; font-size: 13px; }
details.block summary { font-size: 15px; }
#v-balance .btn.primary { margin-top: auto; }
.thanks-icon { width: 60px; height: 60px; }
.choice.tile { padding: 9px 8px 9px 34px; }
.choice.tile input { width: 20px !important; height: 20px !important; }
#v-choices .btn.link { font-size: 13px; padding: 6px 4px 0; margin-top: 4px; }
.choice.tile input { left: 9px; right: auto; top: 9px; }
.choice.tile strong { font-size: 13.5px; }
.choice.tile .price { display: block !important; background: none; padding: 0; margin-top: 3px !important; color: var(--gris) !important; font-weight: 600; }
#v-choices h1, #v-balance h1, #v-thanks h1 { font-size: clamp(20px, 3.3vh, 28px); }
.stages small { margin-top: 5px; }
.sum { grid-template-columns: repeat(3, 1fr); }
.sum .wide { grid-column: auto; }
.sum small { font-size: 11px; }
.sum b { font-size: 15px; line-height: 1.2; display: block; }
#comfortText { display: none; }
.picked { list-style: none; padding: 0; margin: 0; }
.picked li { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; font-weight: 600; color: var(--encre); }
.picked li span { font-size: 10px; padding: 2px 7px; }
#effect { font-weight: 700; color: var(--bon); font-size: 15px; text-align: center; }
#v-balance .stages { margin: 2px 0 6px; }
#v-balance .btn.link, #v-thanks .btn.link { padding: 6px; font-size: 14px; }
@media (max-height: 700px) {
  header { margin-bottom: 6px; } header small { display: none; }
  .stage-label { display: none; }
  .me-strip .meteo-days { display: none; }
  .choice.tile { padding: 6px 6px 6px 32px; }
  #v-choices h1, #v-balance h1, #v-thanks h1 { font-size: 19px; margin: 0 0 6px; }
  .block { padding: 10px; margin: 5px 0; }
  .app { padding-top: calc(6px + env(safe-area-inset-top)); }
  .btn { padding: 12px; }
  .tiles { gap: 6px; }
  .btn.link { padding: 6px; }
  .stages .grade { font-size: 19px; }
  .choice.tile input { top: 7px; left: 7px; }
  .me-strip { padding: 8px 10px; } .me-strip .grade { font-size: 20px; }
  .tiles-head { margin: 2px 0 3px; }
  .choice.tile .price { display: none !important; }
  .tiles-head span { font-size: 10px; padding: 3px 8px; }
  .me-strip .t { font-size: 17px; }
  .live { padding: 8px 8px 8px 12px; }
}
</style>
</head>
<body>
<div class="hero-bg" aria-hidden="true"></div>
<main class="app">
<header><img class="edf-logo" src="/assets/logo-edf.svg" alt="EDF"><span>Météo de mon logement<br><small>Démo · défi confort d’été</small></span></header>
<p id="error" class="error" role="alert"></p>

<section class="view active" id="v-wait">
  <div class="intro"><p class="stage-label">Démo</p><h1 id="waitTitle">Connexion…</h1></div>
  <div class="block wait-card"><div class="radar" aria-hidden="true"><i></i><i></i><i></i><b></b></div><p id="waitText">Ça commence bientôt.</p><button class="btn secondary" id="retry" hidden>Réessayer</button></div>
</section>

<section class="view" id="v-question">
  <div class="intro"><div class="qbar" id="qBar" aria-hidden="true"></div><div class="progress"><span id="qSection"></span><b id="qNum"></b></div><h1 id="qTitle"></h1></div>
  <div id="qOpts"></div>
  <button class="btn link" id="qBack">← Retour</button>
</section>

<section class="view" id="v-choices">
  <div class="intro"><p class="stage-label">Mes solutions</p><h1>Cochez ce que vous feriez.</h1></div>
  <div class="block me-strip" id="myProfile"></div>
  <div class="tiles-head"><span class="tag-low">Low tech · gestes simples</span></div><div class="tiles" id="lowChoices"></div>
  <div class="tiles-head"><span class="tag-high">High tech · équipements</span></div><div class="tiles" id="highChoices"></div>
  <div class="live" id="preview" aria-live="polite"></div>
  <button class="btn link" onclick="editAnswers()">Modifier mes réponses</button>
</section>

<section class="view" id="v-balance">
  <div class="intro"><p class="stage-label">Mon bilan</p><h1>Ce que ça change.</h1></div>
  <div class="block"><div class="stages" id="gradePath"></div><p id="effect" class="muted"></p></div>
  <div class="block"><h2 style="font-size:16px">Mes choix</h2><ul class="picked" id="picked"></ul></div>
  <p id="saveStatus" role="status"></p>
  <button class="btn primary" id="saveBtn" onclick="savePlan()">Valider mon plan</button>
  <button class="btn link" onclick="show('choices')">Modifier mes choix</button>
</section>

<section class="view" id="v-thanks">
  <div class="intro"><p class="stage-label">C’est validé</p><h1>Regardez le grand écran.</h1></div>
  <div class="block"><svg class="thanks-icon" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="38"/><path id="checkPath" d="M22 39 L33 50 L55 27"/></svg><div id="savedSummary"></div></div>
  <button class="btn link" onclick="show('balance')">Revoir mon bilan</button>
</section>
</main>
<script src="/vendor/anime.umd.min.js"></script><script src="/ui.js"></script>
<script src="/questions.js"></script><script src="/solutions.js"></script><script>
const storage = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k,v) { try { localStorage.setItem(k,v); } catch {} } };
let me, sessionId, participantNumber, answers = {}, chosen = new Set(), view = 'wait', qi = -1, editing = false, built = false, busy = false, lastGrade = null;
const badge = (g, cls='') => `<span class="grade grade-${g} ${cls}">${g}</span>`;
const path = (...gs) => `<span class="grade-path">${gs.map(g=>badge(g)).join('<span class="arrow">→</span>')}</span>`;
function currentPlan() { return estimatePlan(answers,[...chosen]); }
function fitHero(sec = document.getElementById('v-'+view)) { const intro = sec && sec.querySelector('.intro'); if (intro) document.querySelector('.hero-bg').style.height = Math.round(intro.getBoundingClientRect().bottom + scrollY + 44) + 'px'; }
addEventListener('resize', () => fitHero());
function show(v) {
  const changed = view !== v; view = v;
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id==='v-'+v));
  if(v==='choices'||v==='balance') updatePlan();
  window.scrollTo(0,0);
  const sec = document.getElementById('v-'+v); fitHero(sec);
  if(!changed) return;
  UI.enter(sec.querySelectorAll('.intro > *, :scope > .block, :scope > .btn'), { y: 20, stagger: 50 });
  if(v==='choices') UI.pop('#myProfile .big-grade', { delay: 200 });
  if(v==='balance') UI.pop('#gradePath .grade', { delay: 200, stagger: 160 });
  if(v==='thanks') { UI.pop('.thanks-icon circle'); UI.draw('#checkPath', { duration: 700, delay: 300 }); }
}
async function api(action, body) { const r=await fetch('/api/'+action, body === undefined ? {cache:'no-store'} : {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok) throw Error(d.error || 'Connexion impossible');return d; }
function error(e) { document.getElementById('error').textContent=e.message; }
async function join() { try {const d=await api('join',{});me=d.id;sessionId=d.sessionId;storage.set('ml_id',me);storage.set('ml_session',sessionId);built=false;answers={};chosen=new Set();qi=-1;editing=false;render(d);document.getElementById('error').textContent='';document.getElementById('retry').hidden=true;}catch(e){error(e);document.getElementById('retry').hidden=false;} }
document.getElementById('retry').onclick=join;
function render(d) {
 if(!d.known || d.sessionId!==sessionId) return join();
 participantNumber=d.participantNumber;answers=Object.assign({}, d.answers || {}, answers);
 if(d.phase==='lobby') {document.getElementById('waitTitle').textContent='Vous êtes dans la salle.';document.getElementById('waitText').textContent=`${d.connected} connecté${d.connected>1?'s':''} · ${QUESTIONS.length} questions`;show('wait');return;}
 if(editing || !isComplete(answers)) { if(qi<0){qi=Math.max(0,QUESTIONS.findIndex(q=>answers[q.key]===undefined));buildQuestion();} if(view!=='question')show('question'); return; }
 if(!built) {built=true;let draft=[];try{draft=JSON.parse(storage.get('ml_plan_'+sessionId)||'[]');}catch{}chosen=new Set(d.plan?.ids || draft);buildChoices();show('choices');}
}
function buildQuestion() {
 const q=QUESTIONS[qi], sec=SECTIONS.find(x=>x.id===q.section);
 document.getElementById('qBar').innerHTML=QUESTIONS.map((x,i)=>`<i class="${i===qi?'now':answers[x.key]!==undefined?'done':''}"></i>`).join('');
 document.getElementById('qSection').textContent=`${sec.e} ${sec.title}`;
 document.getElementById('qNum').textContent=`${qi+1}/${QUESTIONS.length}`;
 document.getElementById('qTitle').textContent=q.title;
 document.getElementById('qBack').hidden=qi===0;
 const box=document.getElementById('qOpts');
 box.innerHTML=q.options.map(o=>`<button class="opt ${answers[q.key]===o.v?'sel':''}" data-v="${o.v}"><span class="e" aria-hidden="true">${o.e}</span><span class="txt">${o.label}</span></button>`).join('');
 box.querySelectorAll('button').forEach(btn=>btn.onclick=async()=>{if(busy)return;busy=true;
  box.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b===btn));UI.bump(btn,1.03);
  try{await api('answer',{id:me,key:q.key,value:btn.dataset.v});answers[q.key]=btn.dataset.v;document.getElementById('error').textContent='';
   setTimeout(()=>{busy=false;nextQuestion();},250);}catch(e){busy=false;error(e);}});
 fitHero(document.getElementById('v-question'));
 UI.enter(document.querySelectorAll('#v-question .intro > *:not(.qbar)'), { y: 12, stagger: 40 });
 UI.enter(box.children, { y: 20, stagger: 55, delay: 80 });
}
function nextQuestion() {
 const next=QUESTIONS.findIndex((q,i)=>i>qi&&(editing||answers[q.key]===undefined));
 const missing=QUESTIONS.findIndex(q=>answers[q.key]===undefined);
 if(next>=0){qi=next;buildQuestion();window.scrollTo(0,0);return;}
 if(missing>=0){qi=missing;buildQuestion();return;}
 editing=false;qi=-1;built=true;buildChoices();show('choices');
}
document.getElementById('qBack').onclick=()=>{if(qi>0){qi--;buildQuestion();}};
function editAnswers(){editing=true;qi=0;buildQuestion();show('question');}
function buildChoices() {
 const p=computeProfile(answers);
 for(const id of [...chosen])if(!availableSolutions(answers).some(x=>x.id===id))chosen.delete(id);
 // Météo fictive de démonstration : pic de canicule de la région jeudi (p.out).
 document.getElementById('myProfile').innerHTML=`${badge(p.grade,'big-grade')}<div style="flex:1"><div class="t num">${p.tNo} °C <small>chez vous</small></div><p class="alert">⚠️ Canicule jeudi : ${p.out} °C dehors</p></div>`;
 for(const type of ['low','high']) {const box=document.getElementById(type+'Choices');box.innerHTML=availableSolutions(answers).filter(s=>s.type===type).map(s=>`<label class="choice tile" title="${s.detail}"><input type="checkbox" value="${s.id}" ${chosen.has(s.id)?'checked':''}><strong>${s.label}</strong><small class="price">${s.detail}</small></label>`).join('');box.querySelectorAll('input').forEach(input=>input.onchange=()=>{input.checked?chosen.add(input.value):chosen.delete(input.value);storage.set('ml_plan_'+sessionId,JSON.stringify([...chosen]));if(input.checked)UI.bump(input);updatePlan();});}
 updatePlan();
}
function updatePlan() {
 const auto=document.querySelector('input[value="auto"]');if(auto){auto.disabled=!hasExterior(answers)&&!chosen.has('shade');if(auto.disabled){auto.checked=false;chosen.delete('auto');}}
 const p=currentPlan();
 const pv=document.getElementById('preview');
 pv.innerHTML=`<div class="mid">${path(p.grade,p.planGrade)}<div class="temp-now num">${p.tPlan} °C</div></div><button class="go" onclick="show('balance')">Voir mon bilan</button>`;
 if(view==='choices'&&lastGrade!==null&&lastGrade!==p.planGrade) UI.bump(pv.querySelector('.grade-path .grade:last-child'));
 lastGrade=p.planGrade;
 document.getElementById('gradePath').innerHTML=[['Avant',p.grade,p.tNo],['Après',p.planGrade,p.tPlan]].map(([t,g,c])=>`<div>${badge(g)}<small>${t} · ${c} °C</small></div>`).join('<span class="arrow">→</span>');
 document.getElementById('effect').textContent=!p.ids.length?'Aucun choix pour l’instant.':p.gain>0?`${p.gain} °C de moins chez vous.`:p.fan?'Plus de confort ressenti.':'';
 const picked=SOLUTIONS.filter(s=>p.ids.includes(s.id));
 document.getElementById('picked').innerHTML=picked.length?picked.map(s=>`<li><span class="${s.type==='low'?'tag-low':'tag-high'}">${s.type==='low'?'Low':'High'}</span>${s.label}</li>`).join(''):'<li class="muted">Rien de coché.</li>';
 document.getElementById('saveStatus').textContent='';
}
async function savePlan() {
 const btn=document.getElementById('saveBtn');btn.disabled=true;
 try {const d=await api('engage',{id:me,actions:[...chosen]});document.getElementById('savedSummary').innerHTML=`<p>${path(d.plan.grade,d.plan.planGrade)}</p><p><strong>${d.plan.tNo} °C → ${d.plan.tPlan} °C</strong></p>`;show('thanks');}catch(e){document.getElementById('saveStatus').textContent='Erreur : '+e.message;}finally{btn.disabled=false;}
}
(async()=>{me=storage.get('ml_id');sessionId=storage.get('ml_session');if(me){try{render(await api('state?id='+encodeURIComponent(me)));}catch{await join();}}else await join();setInterval(async()=>{if(me)try{render(await api('state?id='+encodeURIComponent(me)));}catch{}},1000);})();
</script></body></html>
